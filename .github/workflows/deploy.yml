name: Deploy to Linode

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: booklore-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
          HOST: ${{ secrets.LINODE_HOST }}
          PORT: ${{ secrets.LINODE_SSH_PORT }}
        run: |
          test -n "$SSH_KEY" || { echo "Missing LINODE_SSH_KEY"; exit 1; }
          test -n "$HOST" || { echo "Missing LINODE_HOST"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy current main branch
        env:
          HOST: ${{ secrets.LINODE_HOST }}
          USER: ${{ secrets.LINODE_USER }}
          PORT: ${{ secrets.LINODE_SSH_PORT }}
          APP_DIR: ${{ secrets.LINODE_APP_DIR }}
        run: |
          ssh -p "${PORT:-22}" "${USER:-booklore}@${HOST}" \
            "cd '${APP_DIR:-/opt/booklore-reader}' && DEPLOY_BRANCH=main ./scripts/update.sh"
